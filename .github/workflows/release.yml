name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1.0，必须已存在）'
        required: true
        type: string
      publish:
        description: '立即发布正式 Release（不勾选则创建为 draft）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: ncm_album_downloader

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux (glibc) ----
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,   name: linux-x86_64,       archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,  name: linux-aarch64,      archive: tar.gz }
          # ---- Linux (musl, 全静态) ----
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  name: linux-x86_64-musl,  archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-aarch64-musl, archive: tar.gz }
          # ---- Windows ----
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     name: windows-x86_64,     archive: zip    }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,    name: windows-aarch64,    archive: zip    }
          # ---- macOS ----
          - { os: macos-latest,     target: aarch64-apple-darwin,       name: macos-aarch64,      archive: tar.gz }
          - { os: macos-latest,     target: x86_64-apple-darwin,        name: macos-x86_64,       archive: tar.gz }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Linux 依赖：
      - name: Install Linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config musl-tools

      # musl target 需要告诉 cc-rs 和 rustc 使用 musl-gcc
      # （host 和 target 架构相同，所以 musl-gcc 直接就是对的架构）
      - name: Configure musl toolchain
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          TARGET_UPPER="$(echo "$TARGET" | tr 'a-z-' 'A-Z_')"
          echo "CC_${TARGET}=musl-gcc"                   >> "$GITHUB_ENV"
          echo "CC_${TARGET_UPPER}=musl-gcc"             >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          SRC="target/${{ matrix.target }}/release"
          STAGE="dist/stage"
          ARCHIVE_NAME="${BIN_NAME}-${TAG}-${{ matrix.name }}.${{ matrix.archive }}"
          mkdir -p "$STAGE"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$SRC/${BIN_NAME}.exe" "$STAGE/"
          else
            cp "$SRC/${BIN_NAME}" "$STAGE/"
          fi

          for f in README.md LICENSE LICENSE-MIT LICENSE-APACHE; do
            if [ -f "$f" ]; then cp "$f" "$STAGE/"; fi
          done

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$STAGE" && 7z a "../${ARCHIVE_NAME}" . >/dev/null)
          else
            (cd "$STAGE" && tar czf "../${ARCHIVE_NAME}" .)
          fi

          echo "ARCHIVE=dist/${ARCHIVE_NAME}" >> "$GITHUB_ENV"
          ls -lh "dist/${ARCHIVE_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show files
        run: ls -lhR artifacts

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name:     ${{ inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'push' || inputs.publish != true }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/**