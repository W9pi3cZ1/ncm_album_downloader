name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'   # v0.1.0 / v0.1.0-beta.1 均可
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1.0，必须已存在）'
        required: true
        type: string
      publish:
        description: '立即发布正式 Release（不勾选则创建为 draft）'
        required: false
        type: boolean
        default: false

# 创建/更新 release 需要 contents:write
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: ncm_album_downloader

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, name: linux-x86_64,   archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   name: windows-x86_64, archive: zip    }
          - { os: macos-latest,   target: aarch64-apple-darwin,     name: macos-aarch64,  archive: tar.gz }
          - { os: macos-latest,   target: x86_64-apple-darwin,      name: macos-x86_64,   archive: tar.gz }

    steps:
      # 手动触发时用输入的 tag；push tag 时用当前 ref
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # reqwest + native-tls 在 Linux 上需要 OpenSSL 头文件
      # 若你用的是 rustls-tls，这一步骤可以删掉
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          SRC="target/${{ matrix.target }}/release"
          STAGE="dist/stage"
          ARCHIVE_NAME="${BIN_NAME}-${TAG}-${{ matrix.name }}.${{ matrix.archive }}"
          mkdir -p "$STAGE"

          # 二进制
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$SRC/${BIN_NAME}.exe" "$STAGE/"
          else
            cp "$SRC/${BIN_NAME}" "$STAGE/"
          fi

          # 顺手带上文档 / 许可证
          for f in README.md LICENSE LICENSE-MIT LICENSE-APACHE; do
            [ -f "$f" ] && cp "$f" "$STAGE/" || true
          done

          # 打归档（归档落在 dist/ 下）
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$STAGE" && 7z a "../${ARCHIVE_NAME}" . >/dev/null)
          else
            (cd "$STAGE" && tar czf "../${ARCHIVE_NAME}" .)
          fi

          echo "ARCHIVE=dist/${ARCHIVE_NAME}" >> "$GITHUB_ENV"
          ls -lh "dist/${ARCHIVE_NAME}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name:     ${{ inputs.tag || github.ref_name }}
          # push tag     → 强制 draft
          # 手动触发      → 勾选 publish 则正式，否则 draft
          draft: ${{ github.event_name == 'push' || inputs.publish != true }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ env.ARCHIVE }}