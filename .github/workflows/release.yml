name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1.0，必须已存在）'
        required: true
        type: string
      publish:
        description: '立即发布正式 Release（不勾选则创建为 prerelease）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: ncm_album_downloader

jobs:
  setup:
    name: Resolve release info
    runs-on: ubuntu-latest
    outputs:
      tag:        ${{ steps.info.outputs.tag }}
      name:       ${{ steps.info.outputs.name }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            NAME="$TAG"
            PRERELEASE="false"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            NAME="$TAG"
            if [ "${{ inputs.publish }}" = "true" ]; then
              PRERELEASE="false"
            else
              PRERELEASE="true"
            fi
          else
            # push 到 master：固定 tag=nightly，每次覆盖同一个 release
            SHORT_SHA="$(git rev-parse --short=7 HEAD)"
            DATE="$(date -u +%Y%m%d)"
            TAG="nightly"
            NAME="nightly-${DATE}-${SHORT_SHA}"
            PRERELEASE="true"
          fi
          {
            echo "tag=${TAG}"
            echo "name=${NAME}"
            echo "prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=${TAG} name=${NAME} prerelease=${PRERELEASE}"

  build:
    name: Build ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,   name: linux-x86_64,       archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,  name: linux-aarch64,      archive: tar.gz }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  name: linux-x86_64-musl,  archive: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-aarch64-musl, archive: tar.gz }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     name: windows-x86_64,     archive: zip    }
          - { os: windows-11-arm,   target: aarch64-pc-windows-msvc,    name: windows-aarch64,    archive: zip    }
          - { os: macos-latest,     target: aarch64-apple-darwin,       name: macos-aarch64,      archive: tar.gz }
          - { os: macos-latest,     target: x86_64-apple-darwin,        name: macos-x86_64,       archive: tar.gz }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Show commit being built
        shell: bash
        run: |
          echo "Ref:     ${{ inputs.tag || github.ref }}"
          echo "SHA:     $(git rev-parse HEAD)"
          echo "Subject: $(git log -1 --pretty=%s)"

      - name: Install Linux build deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config musl-tools

      - name: Configure musl toolchain
        if: endsWith(matrix.target, '-musl')
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          TARGET_UPPER="$(echo "$TARGET" | tr 'a-z-' 'A-Z_')"
          echo "CC_${TARGET}=musl-gcc"                       >> "$GITHUB_ENV"
          echo "CC_${TARGET_UPPER}=musl-gcc"                 >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${TARGET_UPPER}_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.setup.outputs.tag }}"
          SRC="target/${{ matrix.target }}/release"
          STAGE="dist/stage"
          ARCHIVE_NAME="${BIN_NAME}-${TAG}-${{ matrix.name }}.${{ matrix.archive }}"
          mkdir -p "$STAGE"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$SRC/${BIN_NAME}.exe" "$STAGE/"
          else
            cp "$SRC/${BIN_NAME}" "$STAGE/"
          fi

          for f in README.md LICENSE LICENSE-MIT LICENSE-APACHE; do
            if [ -f "$f" ]; then cp "$f" "$STAGE/"; fi
          done

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$STAGE" && 7z a "../${ARCHIVE_NAME}" . >/dev/null)
          else
            (cd "$STAGE" && tar czf "../${ARCHIVE_NAME}" .)
          fi

          echo "ARCHIVE=dist/${ARCHIVE_NAME}" >> "$GITHUB_ENV"
          ls -lh "dist/${ARCHIVE_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          # 90 天，GitHub 免费版上限；旧 nightly 靠这个留存
          retention-days: 90

  release:
    name: Publish release
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show files
        run: ls -lhR artifacts

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # nightly 固定用同一个 tag，会自动找到已有 release 并更新
          tag_name:   ${{ needs.setup.outputs.tag }}
          name:       ${{ needs.setup.outputs.name }}
          prerelease: ${{ needs.setup.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/**