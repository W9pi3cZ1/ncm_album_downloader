name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.1.0，必须已存在）'
        required: true
        type: string
      publish:
        description: '立即发布正式 Release（不勾选则创建为 draft）'
        required: false
        type: boolean
        default: false

# 创建/更新 release 需要 contents:write
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: ncm_album_downloader

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux (glibc) ----
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu,       name: linux-x86_64,       archive: tar.gz, cross: false }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu,      name: linux-aarch64,      archive: tar.gz, cross: true  }
          # ---- Linux (musl, 全静态, 可直接跑在 alpine 等) ----
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl,      name: linux-x86_64-musl,  archive: tar.gz, cross: true  }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl,     name: linux-aarch64-musl, archive: tar.gz, cross: true  }
          - { os: ubuntu-latest, target: armv7-unknown-linux-musleabihf, name: linux-armv7-musl,   archive: tar.gz, cross: true  }
          # ---- Windows ----
          - { os: windows-latest, target: x86_64-pc-windows-msvc,        name: windows-x86_64,     archive: zip,    cross: false }
          # ---- macOS ----
          - { os: macos-latest,   target: aarch64-apple-darwin,          name: macos-aarch64,      archive: tar.gz, cross: false }
          - { os: macos-latest,   target: x86_64-apple-darwin,           name: macos-x86_64,       archive: tar.gz, cross: false }

    steps:
      # 手动触发时用输入的 tag；push tag 时用当前 ref
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 只在「本地编译 + Linux glibc」时才有必要装 openssl 头文件
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest' && matrix.cross == false
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cross 用 Docker 镜像里自带的工具链，处理 musl / 交叉编译
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          SRC="target/${{ matrix.target }}/release"
          STAGE="dist/stage"
          ARCHIVE_NAME="${BIN_NAME}-${TAG}-${{ matrix.name }}.${{ matrix.archive }}"
          mkdir -p "$STAGE"

          # 二进制
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$SRC/${BIN_NAME}.exe" "$STAGE/"
          else
            cp "$SRC/${BIN_NAME}" "$STAGE/"
          fi

          # 顺手带上文档 / 许可证
          for f in README.md LICENSE LICENSE-MIT LICENSE-APACHE; do
            if [ -f "$f" ]; then cp "$f" "$STAGE/"; fi
          done

          # 打归档（归档落在 dist/ 下）
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$STAGE" && 7z a "../${ARCHIVE_NAME}" . >/dev/null)
          else
            (cd "$STAGE" && tar czf "../${ARCHIVE_NAME}" .)
          fi

          echo "ARCHIVE=dist/${ARCHIVE_NAME}" >> "$GITHUB_ENV"
          ls -lh "dist/${ARCHIVE_NAME}"

      # 只上传 artifact，不碰 release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  # 所有构建完成后再统一创建/更新 Release，避免多个 job 抢写导致 notes 重复
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show files
        run: ls -lhR artifacts

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name:     ${{ inputs.tag || github.ref_name }}
          # push tag → 强制 draft
          # 手动触发 → 勾选 publish 则正式，否则 draft
          draft: ${{ github.event_name == 'push' || inputs.publish != true }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/**