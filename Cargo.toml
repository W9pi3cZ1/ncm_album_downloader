[package]
name = "ncm_album_downloader"
version = "0.1.2"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cookie = "0.18.2"
cookie_store = { version = "0.22.1" }
cookiestxt-rs = { version = "0.1.4", features = ["cookie_store"] }
futures = "0.3.34"
indicatif = "0.18.6"
infer = "0.22.0"
lofty = "0.25.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "stream", "rustls-no-provider"] }
reqwest_cookie_store = "0.10.0"
ring = "0.17.14"
rustls = { version = "0.23.45", features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
